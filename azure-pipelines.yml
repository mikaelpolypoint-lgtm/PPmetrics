trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: FirebaseCredentials

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
      npm run build
    displayName: 'npm install and build'

  - script: |
      echo "Creating Firebase service account key file..."
      echo $(FIREBASE_SERVICE_ACCOUNT) | base64 -d > $HOME/firebase-key.json
    displayName: 'Create service account key file'
    env:
      FIREBASE_SERVICE_ACCOUNT: $(FIREBASE_SERVICE_ACCOUNT)

  - script: |
      npm install -g firebase-tools
      export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json
      firebase deploy --only hosting,firestore --non-interactive
    displayName: 'Deploy to Firebase Hosting'
    env:
      GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-key.json

