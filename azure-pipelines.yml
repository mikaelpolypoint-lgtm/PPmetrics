trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: FirebaseCredentials

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
      npm run build
    displayName: 'npm install and build'

  - script: |
      npm install -g firebase-tools
      firebase deploy --token $(FIREBASE_TOKEN) --only hosting --non-interactive
    displayName: 'Deploy to Firebase Hosting'

